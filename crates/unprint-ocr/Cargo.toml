[package]
name = "unprint-ocr"
version = "0.1.0"
edition = "2021"
description = "OCR text reading — tesseract CLI, line assembly, ink-aware refinement (depends only on geometry)"

[dependencies]
unprint-geometry = { path = "../unprint-geometry" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
