[package]
name = "unscan"
version = "0.2.0"
edition = "2021"
description = "Replace raster/scanned text with native vector text — zero information loss, maximum vectorization"
license = "MIT"

[[bin]]
name = "unscan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
ab_glyph = "0.2"
lopdf = "0.34"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustybuzz = "0.18"
