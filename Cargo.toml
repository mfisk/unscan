[workspace]
members = ["crates/unprint-fonts"]
resolver = "2"

[package]
name = "unprint"
version = "0.2.0"
edition = "2021"
description = "Replace raster/scanned text with native vector text — zero information loss, maximum vectorization"
license = "MIT"

[[bin]]
name = "unprint"
path = "src/main.rs"

[[bin]]
name = "gen_training_data"
path = "src/bin/gen_training_data.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
image = "0.25"
ab_glyph = "0.2"
unprint-fonts = { path = "crates/unprint-fonts" }
lopdf = "0.34"
walkdir = "2"
rayon = "1.10"
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
freetype-rs = "0.38"
rustybuzz = "0.18"
ttf-parser = { version = "0.24", features = ["opentype-layout"] }
subsetter = "0.2"
base64 = "0.22.1"
rand = { version = "0.8", features = ["small_rng"] }

# dev is left on cargo defaults (opt-level=0, debug=true, incremental) - fastest iteration with debuginfo
# fastbuild is explicit fastest compile, no debuginfo, lowest RAM
[profile.fastbuild]
inherits = "dev"
opt-level = 0
debug = 0
lto = false
codegen-units = 64
split-debuginfo = "off"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
panic = "abort"
strip = "debuginfo"

[dependencies.memmap2]
version = "0.9"

[dependencies.pprof]
version = "0.14"
features = ["flamegraph"]
optional = true

[features]
profile = ["pprof"]

# portable = release build but without target-cpu=native — for distribution
[profile.portable]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 2
panic = "abort"
strip = "debuginfo"

