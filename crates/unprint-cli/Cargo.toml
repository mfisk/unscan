[package]
name = "unprint-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "unprint"
path = "src/main.rs"

[dependencies]
unprint = { path = "../.." }
unprint-report = { path = "../unprint-report" }
unprint-fonts = { path = "../unprint-fonts" }
unprint-geometry = { path = "../unprint-geometry" }
clap = { version = "4", features = ["derive", "env"] }
image = "0.25"
lopdf = "0.34"
walkdir = "2"
rayon = "1.10"
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
subsetter = "0.2"
base64 = "0.22.1"
libm = "0.2"
rustc-hash = "2"
rand = { version = "0.8", features = ["small_rng"] }
write-fonts = "0.3"
read-fonts = { version = "0.1", features = ["std"] }
font-types = "0.2"
flate2 = "1.1"
memmap2 = "0.9"
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
report = []
profile = ["pprof", "unprint/profile"]
