<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" width="180" height="240">
  <!-- Linotype Machine - simplified silhouette -->
  <!-- A Linotype is a large, complex hot metal typesetting machine -->
  <!-- This is a recognizable simplified profile -->

  <!-- Base/feet -->
  <rect x="10" y="220" width="160" height="8" rx="2" fill="#222"/>

  <!-- Main body frame - large casting mechanism -->
  <rect x="30" y="100" width="80" height="120" rx="4" fill="#333"/>

  <!-- Metal pot (crucible) at bottom right -->
  <rect x="110" y="160" width="50" height="60" rx="6" fill="#444"/>
  <rect x="115" y="155" width="40" height="10" rx="2" fill="#555"/>

  <!-- Magazine (matrix storage) at top - angled like the real machine -->
  <polygon points="25,30 120,10 125,100 30,100" fill="#444" stroke="#333" stroke-width="2"/>
  <!-- Magazine channels (vertical lines showing matrix slots) -->
  <line x1="40" y1="35" x2="38" y2="98" stroke="#555" stroke-width="0.8"/>
  <line x1="52" y1="32" x2="48" y2="98" stroke="#555" stroke-width="0.8"/>
  <line x1="64" y1="28" x2="58" y2="98" stroke="#555" stroke-width="0.8"/>
  <line x1="76" y1="24" x2="68" y2="98" stroke="#555" stroke-width="0.8"/>
  <line x1="88" y1="20" x2="78" y2="98" stroke="#555" stroke-width="0.8"/>
  <line x1="100" y1="16" x2="88" y2="98" stroke="#555" stroke-width="0.8"/>
  <line x1="112" y1="13" x2="98" y2="98" stroke="#555" stroke-width="0.8"/>

  <!-- Keyboard assembly (front) -->
  <rect x="15" y="180" width="90" height="35" rx="3" fill="#555"/>
  <!-- Keyboard keys (simplified rows) -->
  <g fill="#777">
    <circle cx="28" cy="190" r="3"/>
    <circle cx="38" cy="190" r="3"/>
    <circle cx="48" cy="190" r="3"/>
    <circle cx="58" cy="190" r="3"/>
    <circle cx="68" cy="190" r="3"/>
    <circle cx="78" cy="190" r="3"/>
    <circle cx="88" cy="190" r="3"/>
    <circle cx="33" cy="200" r="3"/>
    <circle cx="43" cy="200" r="3"/>
    <circle cx="53" cy="200" r="3"/>
    <circle cx="63" cy="200" r="3"/>
    <circle cx="73" cy="200" r="3"/>
    <circle cx="83" cy="200" r="3"/>
  </g>

  <!-- Distributor bar at top -->
  <rect x="20" y="25" width="108" height="6" rx="2" fill="#666"/>

  <!-- Delivery mechanism / spaceband -->
  <rect x="105" y="100" width="8" height="55" rx="2" fill="#555"/>

  <!-- Mold wheel (casting disc) -->
  <circle cx="70" cy="140" r="18" fill="#555" stroke="#666" stroke-width="2"/>
  <circle cx="70" cy="140" r="8" fill="#444"/>
  <circle cx="70" cy="140" r="3" fill="#333"/>

  <!-- Output tray -->
  <line x1="110" y1="145" x2="165" y2="140" stroke="#555" stroke-width="3" stroke-linecap="round"/>

  <!-- Elevator mechanism -->
  <rect x="112" y="100" width="5" height="55" rx="1" fill="#666"/>
</svg>
