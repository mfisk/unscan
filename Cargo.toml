[workspace]
members = ["crates/unprint-fonts", "crates/unprint-geometry", "crates/unprint-classify", "crates/unprint-ocr", "crates/unprint-report", "crates/unprint-cli"]
resolver = "2"

[workspace.dependencies]
ab_glyph = "0.2"
base64 = "0.22.1"
bitflags = "2"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1.1"
font-types = "0.2"
freetype-rs = "0.38"
image = "0.25.8"
libm = "0.2"
lopdf = "0.34"
memmap2 = "0.9"
pprof = { version = "0.14", features = ["flamegraph"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
read-fonts = { version = "0.1", features = ["std"] }
rustc-hash = "2"
rustybuzz = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsetter = "0.2"
tempfile = "3"
thiserror = "2"
ttf-parser = { version = "0.24", features = ["opentype-layout", "variable-fonts"] }
walkdir = "2"
write-fonts = "0.3"

[package]
name = "unprint"
version = "0.2.0"
edition = "2021"
description = "Replace raster/scanned text with native vector text — zero information loss, maximum vectorization"
license = "MIT"
autobins = false

[[bin]]
name = "gen_training_data"
path = "src/bin/gen_training_data.rs"

[dependencies]
clap = { workspace = true }
image = { workspace = true }
unprint-fonts = { path = "crates/unprint-fonts" }
unprint-geometry = { path = "crates/unprint-geometry" }
lopdf = { workspace = true }
walkdir = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
subsetter = { workspace = true }
base64 = { workspace = true }
libm = { workspace = true }
rustc-hash = { workspace = true }
rand = { workspace = true }
write-fonts = { workspace = true }
read-fonts = { workspace = true }
font-types = { workspace = true }
flate2 = { workspace = true }
memmap2 = { workspace = true }
pprof = { workspace = true, optional = true }

[features]
profile = ["pprof"]

# dev is left on cargo defaults (opt-level=0, debug=true, incremental) - fastest iteration with debuginfo
# fastbuild is explicit fastest compile, no debuginfo, lowest RAM
[profile.fastbuild]
inherits = "dev"
opt-level = 0
debug = 0
lto = false
codegen-units = 64
split-debuginfo = "off"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
panic = "abort"
strip = "debuginfo"

# portable = release build but without target-cpu=native — for distribution
[profile.portable]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 2
panic = "abort"
strip = "debuginfo"

