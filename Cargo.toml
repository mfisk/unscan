[package]
name = "unprint"
version = "0.2.0"
edition = "2021"
description = "Replace raster/scanned text with native vector text — zero information loss, maximum vectorization"
license = "MIT"

[[bin]]
name = "unprint"
path = "src/main.rs"

[[bin]]
name = "gen_training_data"
path = "src/bin/gen_training_data.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
ab_glyph = "0.2"
lopdf = "0.34"
walkdir = "2"
rayon = "1.10"
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
freetype-rs = "0.38"
rustybuzz = "0.18"
subsetter = "0.2"
base64 = "0.22.1"
rand = { version = "0.8", features = ["small_rng"] }

# Fast iteration: opt-level 1 gives ~10x runtime speedup over opt-level 0
# while keeping incremental compilation fast
[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"

[profile.release]
lto = "fat"
codegen-units = 1
